
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BusGo - Passenger Details</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <a class="logo" href="index.html">🚌 BusGo</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="mybookings.html">My Bookings</a>
    </nav>
</header>

<div class="container">
    <div class="card">
        <h2>Passenger Details</h2>

        <div id="bookingSummary"></div>

        <form id="passengerForm">
            <input type="text" id="passengerName"
                placeholder="Passenger Full Name" required>

            <input type="number" id="passengerAge"
                placeholder="Age" min="1" max="120" required>

            <select id="passengerGender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <input type="tel" id="passengerPhone"
                placeholder="Mobile Number" pattern="[0-9]{10}" required>

            <button type="submit">Confirm Booking</button>
        </form>
    </div>
</div>

</body>
</html>
